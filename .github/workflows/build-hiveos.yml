name: Build PRL3060 HiveOS (experimental)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'engine/**'
      - 'hiveos/**'
      - 'scripts/**'
      - 'Dockerfile.build'
      - '.github/workflows/build-hiveos.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile CUDA and run local proof tests
        run: docker build -f Dockerfile.build -t prl3060-build:0.1.1 .
      - name: Export runtime
        run: |
          mkdir -p dist
          docker run --rm -v "$PWD/dist:/export" prl3060-build:0.1.1
          test -s dist/prl3060-kryptex-0.1.1.tar.gz
          sha256sum dist/prl3060-kryptex-0.1.1.tar.gz > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: prl3060-kryptex-experimental
          path: dist/
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - name: Publish experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: eric010/prl1
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c dist/SHA256SUMS
          if gh release view v0.1.1 >/dev/null 2>&1; then
            echo 'Release v0.1.1 already exists; keeping its immutable assets.'
          else
            cat > release-notes.txt <<'NOTES'
          Corrige o primeiro arranque no HiveOS: h-config.sh gera agora config.json ao ser carregado.
          Inclui dois testes de regressão para a integração HiveOS; o build executa 10 testes Rust e 9 testes Python.
          CUDA 12.8.1 / sm_86 / glibc 2.35. Motor de mineração inalterado.
          Experimental: funcionamento numa GPU e shares aceites na Kryptex ainda por validar.
          NOTES
            gh release create v0.1.1 dist/prl3060-kryptex-0.1.1.tar.gz dist/SHA256SUMS --target "$GITHUB_SHA" --prerelease --title 'PRL3060 Kryptex 0.1.1 — correção do arranque HiveOS' --notes-file release-notes.txt
          fi
